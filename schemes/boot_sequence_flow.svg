<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <!-- Card Gradients -->
    <linearGradient id="asmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="schedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="partGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9ca3af" />
    </marker>
    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="550" rx="12" fill="url(#bgGrad)" />

  <!-- Subgrid lines -->
  <g stroke="#374151" stroke-width="0.5" opacity="0.3">
    <path d="M 0,110 L 950,110 M 0,220 L 950,220 M 0,330 L 950,330 M 0,440 L 950,440" />
    <path d="M 190,0 L 190,550 M 380,0 L 380,550 M 570,0 L 570,550 M 760,0 L 760,550" />
  </g>

  <!-- Title -->
  <text x="475" y="45" text-anchor="middle" fill="#f9fafb" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" letter-spacing="1">System Boot &amp; Initialization Sequence</text>

  <!-- Stage 1: crt0.s -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="180" height="110" rx="8" fill="url(#asmGrad)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="130" y="138" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1. Assembly Entry</text>
    <text x="130" y="155" text-anchor="middle" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="11">crt0.s (_entry)</text>
    <text x="130" y="175" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10">Initializes stack (sp)</text>
    <text x="130" y="190" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10">Clears .bss &amp; sets mtvec</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220,165 L 265,165" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
  <text x="242" y="152" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">main()</text>

  <!-- Stage 2: main.c -->
  <g filter="url(#shadow)">
    <rect x="265" y="110" width="200" height="110" rx="8" fill="url(#mainGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="365" y="138" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2. Kernel Setup</text>
    <text x="365" y="155" text-anchor="middle" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11">main.c (main)</text>
    <text x="365" y="175" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="10">Init hardware, heap &amp; HM</text>
    <text x="365" y="190" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="10">Config module scheduler</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 465,165 L 510,165" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
  <text x="487" y="152" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">app_main()</text>

  <!-- Stage 3: app_main -->
  <g filter="url(#shadow)">
    <rect x="510" y="110" width="190" height="110" rx="8" fill="url(#appGrad)" stroke="#10b981" stroke-width="1.5" />
    <text x="605" y="138" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">3. Partition Init</text>
    <text x="605" y="155" text-anchor="middle" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="11">arinc_app.c (app_main)</text>
    <text x="605" y="175" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">Calls partition_init()</text>
    <text x="605" y="190" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">Alloc PCB &amp; binds tasks</text>
  </g>

  <!-- Arrow 3 -> 4 (Vertical down & left) -->
  <path d="M 700,165 L 755,165 L 755,295 L 610,295" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
  <text x="755" y="235" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" transform="rotate(90 755 235)">scheduling start</text>

  <!-- Stage 4: Scheduling Loop -->
  <g filter="url(#shadow)">
    <rect x="360" y="240" width="250" height="110" rx="8" fill="url(#schedGrad)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="485" y="268" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">4. Start scheduling</text>
    <text x="485" y="285" text-anchor="middle" fill="#ede9fe" font-family="system-ui, sans-serif" font-size="11">main.c (arinc_start_scheduling)</text>
    <text x="485" y="305" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10">Enables hardware timer tick</text>
    <text x="485" y="320" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10">longjmp() to partition_OS</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 360,295 L 305,295 L 305,425 L 220,425" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
  <text x="305" y="360" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" transform="rotate(-90 305 360)">partition_OS()</text>

  <!-- Stage 5: partition_OS -->
  <g filter="url(#shadow)">
    <rect x="20" y="370" width="200" height="110" rx="8" fill="url(#partGrad)" stroke="#ec4899" stroke-width="1.5" />
    <text x="120" y="398" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">5. Partition Setup</text>
    <text x="120" y="415" text-anchor="middle" fill="#fce7f3" font-family="system-ui, sans-serif" font-size="11">arinc_partition.c</text>
    <text x="120" y="435" text-anchor="middle" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10">Exec entry point (p1_main)</text>
    <text x="120" y="450" text-anchor="middle" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10">in COLD_START mode</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 220,425 L 265,425" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
  <text x="242" y="412" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">APEX</text>

  <!-- Stage 6: APEX Creation & Normal Mode -->
  <g filter="url(#shadow)">
    <rect x="265" y="370" width="250" height="110" rx="8" fill="url(#appGrad)" stroke="#10b981" stroke-width="1.5" />
    <text x="390" y="398" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">6. Spawning &amp; NORMAL Mode</text>
    <text x="390" y="415" text-anchor="middle" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="11">static_conf.c (p1_main_process)</text>
    <text x="390" y="435" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">1. Calls CREATE_PROCESS &amp; START()</text>
    <text x="390" y="450" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">2. SET_PARTITION_MODE(NORMAL)</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 515,425 L 560,425" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)" />
  <text x="537" y="412" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Scheduler</text>

  <!-- Stage 7: Normal Process execution -->
  <g filter="url(#shadow)">
    <rect x="560" y="370" width="220" height="110" rx="8" fill="url(#schedGrad)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="670" y="398" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">7. Process Loop</text>
    <text x="670" y="415" text-anchor="middle" fill="#ede9fe" font-family="system-ui, sans-serif" font-size="11">arinc_partition.c (NORMAL)</text>
    <text x="670" y="435" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10">Executes process_schedule()</text>
    <text x="670" y="450" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10">Triggers process execution</text>
  </g>

</svg>
